<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Colegio Dr. Antonio Vaca Díez</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: none;
            background: #ffffff;
            overflow: hidden;
        }
        .card-header-custom {
            background: #1e3a8a;
            color: #ffffff;
            padding: 2.2rem 1.5rem 1.8rem;
            text-align: center;
        }
        .btn-primary-custom {
            background: #1e3a8a;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
        }
        .btn-primary-custom:hover {
            background: #172554;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="card-header-custom">
        <i class="bi bi-mortarboard-fill fs-1 d-block mb-2"></i>
        <h1 class="h4 text-white fw-bold">{{ institucion.institucion_linea1 }}</h1>
		<p class="text-muted small">{{ institucion.institucion_linea2 }}</p>
    </div>
    <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show py-2" role="alert">
                        <small>{{ message }}</small>
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label for="username" class="form-label text-muted small fw-semibold">Usuario o Correo</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Ingrese su usuario" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label text-muted small fw-semibold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary-custom text-white w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                </button>
            </div>
        </form>
    </div>
    <div class="card-footer bg-light text-center py-3 border-0">
        <small class="text-muted">Plataforma de Gestión Académica &bull; Avrora Soft</small>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
