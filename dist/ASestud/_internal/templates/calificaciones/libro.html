{% extends "base.html" %}
{% block content %}
<div class="container-fluid py-4">
    <h2 class="text-dark mb-4">Libro de Notas Digital</h2>

    <div class="card shadow mb-4">
        <div class="card-body text-dark">
            <label for="selectCurso" class="form-label fw-bold">Seleccionar Curso:</label>
            <select id="selectCurso" class="form-select">
                <option value="">-- Seleccione un curso --</option>
                {% for c in cursos %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <!-- Contenedor donde se inyectarán los estudiantes -->
    <div id="contenedorEstudiantes" class="text-dark">
        <div class="alert alert-info text-dark">
            <i class="bi bi-info-circle-fill"></i> Seleccione un curso para ver la lista de estudiantes y registrar notas.
        </div>
    </div>
</div>

<script>
document.getElementById('selectCurso').addEventListener('change', function() {
    const curso = this.value;
    const contenedor = document.getElementById('contenedorEstudiantes');
    
    if (!curso) {
        contenedor.innerHTML = '<div class="alert alert-info text-dark">Seleccione un curso para ver la lista de estudiantes.</div>';
        return;
    }

    // Mostrar spinner de carga
    contenedor.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-dark">Cargando estudiantes...</p></div>';

    // Llamada AJAX al backend
    fetch(`/api/estudiantes_por_curso?curso=${encodeURIComponent(curso)}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                contenedor.innerHTML = `<div class="alert alert-danger text-dark">${data.error}</div>`;
                return;
            }
            if (data.length === 0) {
                contenedor.innerHTML = '<div class="alert alert-warning text-dark">No hay estudiantes activos registrados para este curso.</div>';
                return;
            }
            
            // Construir tabla HTML dinámicamente
            let html = `
                <div class="card shadow">
                    <div class="card-header bg-light text-dark">
                        <h5 class="mb-0 text-dark">Estudiantes de ${curso}</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-bordered text-dark">
                                <thead class="table-light text-dark">
                                    <tr>
                                        <th>RUDE</th>
                                        <th>Apellidos y Nombres</th>
                                        <th>Estado</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
            `;
            data.forEach(est => {
                html += `
                    <tr>
                        <td>${est.rude}</td>
                        <td>${est.apellidos}, ${est.nombres}</td>
                        <td><span class="badge bg-success text-white">${est.estado}</span></td>
                        <td class="text-center">
                            <a href="/calificaciones/cargar_notas?curso=${curso}&estudiante_id=${est.id}" class="btn btn-sm btn-primary">
                                <i class="bi bi-pencil-square"></i> Ingresar Notas
                            </a>
                        </td>
                    </tr>
                `;
            });
            html += `</tbody></table></div></div></div>`;
            contenedor.innerHTML = html;
        })
        .catch(error => {
            console.error('Error:', error);
            contenedor.innerHTML = '<div class="alert alert-danger text-dark">Error de conexión al cargar los estudiantes.</div>';
        });
});
</script>
{% endblock %}
